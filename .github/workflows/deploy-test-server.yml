name: Deploy to Test Server

on:
  push:
    branches:
      - develop  # develop 브랜치에 푸시될 때 자동 배포
  pull_request:
    branches:
      - develop
    types: [closed]  # develop으로 PR 병합될 때 자동 배포

jobs:
  deploy:
    name: Deploy to Test Server
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (optional)
        run: |
          if [ -f "package.json" ] && grep -q "\"test\":" package.json; then
            npm test
          else
            echo "No tests configured, skipping..."
          fi
        continue-on-error: true

      - name: Deploy to Test Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          port: ${{ secrets.TEST_SERVER_PORT || 22 }}
          script: |
            cd /home/ec2-user/ezstay_back
            git fetch origin
            git checkout develop
            git pull origin develop
            npm ci --production
            pm2 restart ezstay-backend || pm2 start server.js --name ezstay-backend
            echo "✅ Deployment completed at $(date)"

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "🎉 Deployment to test server succeeded!"
          else
            echo "❌ Deployment to test server failed!"
          fi

      - name: Slack Notification (optional)
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to test server ${{ job.status }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
