name: Deploy to Test Server

on:
  push:
    branches:
      - develop  # develop 브랜치에 푸시될 때 자동 배포
  pull_request:
    branches:
      - develop
    types: [closed]  # develop으로 PR 병합될 때 자동 배포

jobs:
  deploy:
    name: Deploy to Test Server
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (optional)
        run: |
          if [ -f "package.json" ] && grep -q "\"test\":" package.json; then
            npm test
          else
            echo "No tests configured, skipping..."
          fi
        continue-on-error: true

      - name: Get GitHub Actions Runner IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Add GitHub Actions IP to EC2 Security Group
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          RUNNER_IP="${{ steps.ip.outputs.ipv4 }}"
          echo "🌐 GitHub Actions Runner IP: $RUNNER_IP"

          # EC2 보안 그룹에 현재 Runner IP 추가
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${RUNNER_IP}/32 \
            --description "GitHub Actions Runner - Temporary" \
            || echo "⚠️ IP already exists in security group or error occurred"

      - name: Deploy to Test Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /home/ec2-user/ezstay_back
            git fetch origin
            git checkout develop
            git pull origin develop
            npm ci --production
            pm2 restart ezstay-backend || pm2 start server.js --name ezstay-backend
            echo "✅ Deployment completed at $(date)"

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "🎉 Deployment to test server succeeded!"
          else
            echo "❌ Deployment to test server failed!"
          fi

      - name: Remove GitHub Actions IP from EC2 Security Group
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          RUNNER_IP="${{ steps.ip.outputs.ipv4 }}"
          echo "🧹 Removing GitHub Actions Runner IP: $RUNNER_IP"

          # EC2 보안 그룹에서 현재 Runner IP 제거
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${RUNNER_IP}/32 \
            || echo "⚠️ IP does not exist or already removed"

    
